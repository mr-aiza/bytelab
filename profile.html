<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پروفایل من | بایت‌لب</title>
<meta name="description" content="ویرایش مشخصات و رمز عبور حساب کاربری بایت‌لب.">
<link rel="canonical" href="https://bytelabpro.xyz/profile.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#070b12; --panel:#0f1620; --panel-2:#141d2b; --line:#1e2a38;
    --cyan:#4df0c9; --violet:#9c7bff; --paper:#eaf0f4; --muted:#7c8b9c; --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--ink);color:var(--paper);font-family:'Vazirmatn',sans-serif;line-height:1.7;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
  .page-head{padding:150px 0 30px;text-align:center;}
  .page-eyebrow{font-weight:700;font-size:13px;color:var(--violet);letter-spacing:.02em;margin-bottom:14px;display:block;}
  .page-title{font-size:clamp(26px,4vw,38px);font-weight:800;}

  .prof-wrap{max-width:480px;margin:0 auto;padding:10px 24px 100px;display:flex;flex-direction:column;gap:20px;}
  .prof-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;}
  .prof-card h3{font-size:16px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:8px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field:last-of-type{margin-bottom:0;}
  .field label{font-size:13px;color:var(--muted);}
  .field input{
    background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
    color:var(--paper);font-family:inherit;font-size:14px;outline:none;transition:border-color .2s ease;
  }
  .field input:focus{border-color:var(--cyan);}
  .field input:disabled{color:var(--muted);}
  .prof-submit{
    margin-top:16px;background:var(--cyan);color:#06120f;font-weight:700;padding:13px;border:none;
    border-radius:999px;font-family:inherit;font-size:14px;cursor:pointer;width:100%;
    transition:transform .2s ease;
  }
  .prof-submit:hover{transform:translateY(-1px);}
  .prof-submit:disabled{opacity:.6;cursor:default;transform:none;}
  .prof-submit.ghost{background:none;border:1px solid var(--line);color:var(--paper);}
  .prof-submit.ghost:hover{border-color:var(--cyan);color:var(--cyan);}
  .prof-msg{font-size:13px;margin-top:12px;display:none;}
  .prof-msg.show{display:block;}
  .prof-msg.error{color:#ff8080;}
  .prof-msg.success{color:var(--cyan);}
  .loggedout-note{text-align:center;color:var(--muted);padding:40px 20px;}
  .loggedout-note a{color:var(--cyan);}
</style>
</head>
<body>

<div id="siteHeaderPlaceholder"></div>

<section class="page-head">
  <div class="wrap">
    <span class="page-eyebrow">حساب کاربری</span>
    <h1 class="page-title">پروفایل من</h1>
  </div>
</section>

<div class="prof-wrap" id="profWrap">
  <div class="loggedout-note" id="loggedOutNote" style="display:none;">
    برای ویرایش پروفایل اول باید <a href="account.html">وارد حساب</a> بشی.
  </div>

  <div id="profContent" style="display:none;">
    <div class="prof-card">
      <h3>👤 مشخصات</h3>
      <div class="field">
        <label for="pPhone">شماره تماس</label>
        <input type="tel" id="pPhone" disabled>
      </div>
      <div class="field">
        <label for="pName">نام</label>
        <input type="text" id="pName" placeholder="نام و نام‌خانوادگی">
      </div>
      <div class="field">
        <label for="pEmail">ایمیل (اختیاری)</label>
        <input type="email" id="pEmail" placeholder="example@mail.com">
      </div>
      <button class="prof-submit" id="pSaveBtn">ذخیره تغییرات</button>
      <div class="prof-msg" id="pMsg"></div>
    </div>

    <div class="prof-card">
      <h3>🔒 تغییر رمز عبور</h3>
      <div class="field">
        <label for="pCurPass">رمز عبور فعلی</label>
        <input type="password" id="pCurPass">
      </div>
      <div class="field">
        <label for="pNewPass">رمز عبور جدید</label>
        <input type="password" id="pNewPass" placeholder="حداقل ۴ کاراکتر">
      </div>
      <button class="prof-submit" id="pPassBtn">تغییر رمز عبور</button>
      <div class="prof-msg" id="pPassMsg"></div>
    </div>

    <button class="prof-submit ghost" id="pLogoutBtn">خروج از حساب</button>
  </div>
</div>

<script src="assets/bytelab-auth.js"></script>
<script src="header.js"></script>
<script>
(function(){
  function setMsg(el, text, type){
    el.textContent = text;
    el.className = "prof-msg show " + type;
  }

  async function init(){
    if(!(window.BytelabAuth && window.BytelabAuth.isLoggedIn())){
      document.getElementById("loggedOutNote").style.display = "block";
      return;
    }
    document.getElementById("profContent").style.display = "block";

    const user = await window.BytelabAuth.refreshUser();
    document.getElementById("pPhone").value = user.phone || "";
    document.getElementById("pName").value = user.name || "";
    document.getElementById("pEmail").value = user.email || "";
  }

  document.getElementById("pSaveBtn").addEventListener("click", async () => {
    const name = document.getElementById("pName").value.trim();
    const email = document.getElementById("pEmail").value.trim();
    const btn = document.getElementById("pSaveBtn");
    const msgEl = document.getElementById("pMsg");
    btn.disabled = true; btn.textContent = "در حال ذخیره...";
    try {
      await window.BytelabAuth.updateProfile({ name, email });
      setMsg(msgEl, "مشخصات با موفقیت ذخیره شد ✅", "success");
    } catch(err){
      setMsg(msgEl, err.message || "ذخیره ناموفق بود.", "error");
    } finally {
      btn.disabled = false; btn.textContent = "ذخیره تغییرات";
    }
  });

  document.getElementById("pPassBtn").addEventListener("click", async () => {
    const cur = document.getElementById("pCurPass").value;
    const next = document.getElementById("pNewPass").value;
    const btn = document.getElementById("pPassBtn");
    const msgEl = document.getElementById("pPassMsg");
    btn.disabled = true; btn.textContent = "در حال تغییر...";
    try {
      await window.BytelabAuth.changePassword(cur, next);
      setMsg(msgEl, "رمز عبور با موفقیت تغییر کرد ✅", "success");
      document.getElementById("pCurPass").value = "";
      document.getElementById("pNewPass").value = "";
    } catch(err){
      setMsg(msgEl, err.message || "تغییر رمز ناموفق بود.", "error");
    } finally {
      btn.disabled = false; btn.textContent = "تغییر رمز عبور";
    }
  });

  document.getElementById("pLogoutBtn").addEventListener("click", async () => {
    await window.BytelabAuth.logout();
    location.href = "account.html";
  });

  init();
})();
</script>
</body>
</html>
