<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>QR کد ساز | بایت‌لب</title>
<meta name="description" content="QR کد رنگی برای لینک، تماس، تلگرام یا متن — رایگان.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="بایت‌لب">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--ink:#070b12;--panel:#0f1620;--panel-2:#141d2b;--line:#1e2a38;--cyan:#4df0c9;--violet:#9c7bff;--paper:#eaf0f4;--muted:#7c8b9c;--radius:18px;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;overflow-x:hidden;}
  body{background:var(--ink);color:var(--paper);font-family:'Vazirmatn',sans-serif;line-height:1.7;width:100%;margin:0;padding:0;}
  main{margin-top:88px;padding:40px 16px 60px;max-width:580px;margin-left:auto;margin-right:auto;}
  h1{font-size:28px;font-weight:800;margin:0 0 12px;}
  .page-header{margin-bottom:32px;}
  .sec-eyebrow{font-weight:700;font-size:12px;color:var(--violet);letter-spacing:.02em;margin-bottom:8px;text-transform:uppercase;}
  .sec-sub{color:var(--muted);font-size:14px;line-height:1.6;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{flex:0 1 auto;min-width:60px;text-align:center;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;color:var(--muted);transition:all .2s;}
  .tab.active{background:var(--cyan);color:var(--ink);font-weight:800;border-color:transparent;}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:600;}
  input[type=text]{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--paper);font-family:inherit;font-size:13px;}
  input[type=text]:focus{outline:2px solid var(--cyan);border-color:var(--cyan);}
  .color-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .color-item input[type=color]{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;cursor:pointer;}
  .color-item span{display:block;font-size:11px;color:var(--muted);margin-top:6px;text-align:center;}
  .presets{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .preset{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid var(--line);transition:all .2s;}
  button.generate{width:100%;margin-top:16px;background:var(--cyan);border:none;border-radius:10px;padding:12px;color:var(--ink);font-weight:800;font-family:inherit;font-size:14px;cursor:pointer;transition:transform .2s;}
  button.generate:hover{transform:translateY(-1px);}
  #qrResult{display:none;text-align:center;}
  #qrCanvasWrap{background:#fff;border-radius:12px;padding:16px;display:inline-block;margin:16px 0;}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .actions button{border-radius:8px;padding:10px;font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);color:var(--paper);background:var(--panel-2);transition:all .2s;}
  .actions button:first-child{background:var(--cyan);color:var(--ink);font-weight:800;border:none;}
  .hint{color:var(--muted);font-size:11px;margin-top:8px;}
  @media (max-width:640px){main{padding:30px 12px 50px;margin-top:72px;}h1{font-size:24px;}.card{padding:16px;}.tab{padding:7px 10px;font-size:11px;}}
</style>
</head>
<body>
<main>
  <header class="page-header">
    <span class="sec-eyebrow">📱 ابزار</span>
    <h1>QR کد ساز</h1>
    <p class="sec-sub">لینک یا متن رو QR کد کن.</p>
  </header>

  <div class="card">
    <div class="tabs" id="tabs">
      <div class="tab active" data-type="url">لینک</div>
      <div class="tab" data-type="tel">تماس</div>
      <div class="tab" data-type="telegram">تلگرام</div>
      <div class="tab" data-type="text">متن</div>
    </div>
    <label id="fieldLabel">لینک</label>
    <input type="text" id="fieldInput" placeholder="example.com">
    <label style="margin-top:16px;">رنگ‌ها</label>
    <div class="color-row">
      <div class="color-item">
        <input type="color" id="fgColor" value="#070b12">
        <span>QR</span>
      </div>
      <div class="color-item">
        <input type="color" id="bgColor" value="#ffffff">
        <span>پس‌زمینه</span>
      </div>
    </div>
    <div class="presets" id="presets"></div>
    <button class="generate" id="genBtn">ساخت QR</button>
  </div>

  <div class="card" id="qrResult">
    <div id="qrCanvasWrap"></div>
    <div class="actions">
      <button id="downloadBtn">دانلود</button>
      <button id="copyBtn">کپی</button>
    </div>
    <div class="hint">برای چاپ مناسب است</div>
  </div>
</main>

<script src="header.js"></script>
<script>
const tabs = document.querySelectorAll('.tab');
const fieldLabel = document.getElementById('fieldLabel');
const fieldInput = document.getElementById('fieldInput');
let currentType = 'url';
const typeConfig = {url:{label:'لینک',placeholder:'example.com'},tel:{label:'شماره',placeholder:'09123456789'},telegram:{label:'تلگرام',placeholder:'bytelab'},text:{label:'متن',placeholder:'متن شما...'}};
tabs.forEach(tab => {
  tab.addEventListener('click',()=>{tabs.forEach(t=>t.classList.remove('active'));tab.classList.add('active');currentType=tab.dataset.type;const cfg=typeConfig[currentType];fieldLabel.textContent=cfg.label;fieldInput.placeholder=cfg.placeholder;fieldInput.value='';});
});
const presetColors=['#070b12','#4df0c9','#9c7bff','#0f1620','#000000'];
const presetsWrap=document.getElementById('presets');
presetColors.forEach(c=>{const d=document.createElement('div');d.className='preset';d.style.background=c;d.addEventListener('click',()=>{document.getElementById('fgColor').value=c;});presetsWrap.appendChild(d);});
function buildPayload(){const v=fieldInput.value.trim();if(!v)return null;if(currentType==='url'){return /^https?:\/\//i.test(v)?v:'https://'+v;}if(currentType==='tel'){return 'tel:'+v.replace(/\s+/g,'');}if(currentType==='telegram'){const handle=v.replace(/^@/,'');return 'https://t.me/'+handle;}return v;}
let currentQR=null;
document.getElementById('genBtn').addEventListener('click',()=>{const payload=buildPayload();if(!payload){fieldInput.focus();fieldInput.style.borderColor='#ef4444';setTimeout(()=>fieldInput.style.borderColor='',1200);return;}const wrap=document.getElementById('qrCanvasWrap');wrap.innerHTML='';currentQR=new QRCode(wrap,{text:payload,width:240,height:240,colorDark:document.getElementById('fgColor').value,colorLight:document.getElementById('bgColor').value,correctLevel:QRCode.CorrectLevel.H});document.getElementById('qrResult').style.display='block';document.getElementById('qrResult').scrollIntoView({behavior:'smooth',block:'nearest'});window._qrPayload=payload;});
document.getElementById('downloadBtn').addEventListener('click',()=>{const wrap=document.getElementById('qrCanvasWrap');const img=wrap.querySelector('img');const canvas=wrap.querySelector('canvas');const src=(img&&img.src)||(canvas&&canvas.toDataURL('image/png'));if(!src)return;const a=document.createElement('a');a.href=src;a.download='bytelab-qr.png';a.click();});
document.getElementById('copyBtn').addEventListener('click',async()=>{if(!window._qrPayload)return;try{await navigator.clipboard.writeText(window._qrPayload);const btn=document.getElementById('copyBtn');const old=btn.textContent;btn.textContent='شد ✓';setTimeout(()=>btn.textContent=old,1500);}catch(e){}});
</script>
</body>
</html>
