# Workflow دیپلوی سایت بایت‌لب روی گیت‌هاب پیجز
# + ساخت خودکار sitemap.xml قبل از هر دیپلوی (اسکریپت scripts/generate-sitemap.py)
name: Deploy static content to Pages

on:
  # با هر پوش به main
  push:
    branches: ["main"]

  # اجرای دستی از تب Actions
  workflow_dispatch:

  # هر ۶ ساعت یک‌بار، حتی بدون پوش کد.
  # چون مقاله‌های بلاگ مستقیم از تلگرام منتشر می‌شن و پوش گیتی ندارن،
  # این زمان‌بندی باعث می‌شه سایت‌مپ همیشه شامل تازه‌ترین مقاله‌ها باشه
  # و گوگل سریع‌تر بفهمه محتوای جدیدی برای خزیدن هست.
  schedule:
    - cron: "0 */6 * * *"

# دسترسی‌های لازم برای دیپلوی روی Pages
permissions:
  contents: read
  pages: write
  id-token: write

# فقط یک دیپلوی هم‌زمان مجاز باشه؛ دیپلوی‌های در حال اجرا کنسل نمی‌شن
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # تاریخچه‌ی کامل گیت لازمه تا اسکریپت بتونه lastmod واقعی هر صفحه رو حساب کنه
          fetch-depth: 0

      - name: ساخت خودکار sitemap.xml
        run: python3 scripts/generate-sitemap.py

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # آپلود کل مخزن (شامل sitemap.xml تازه‌سازی‌شده)
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
