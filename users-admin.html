<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | بایت‌لب</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#070b12; --panel:#0f1620; --panel-2:#141d2b; --line:#1e2a38;
    --cyan:#4df0c9; --violet:#9c7bff; --paper:#eaf0f4; --muted:#7c8b9c; --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{background:var(--ink);color:var(--paper);font-family:'Vazirmatn',sans-serif;line-height:1.7;min-height:100vh;overflow-x:hidden;}
  .wrap{max-width:900px;margin:0 auto;padding:40px 20px 80px;overflow-x:hidden;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);}
  .table-scroll table{min-width:640px;border-radius:0;}

  /* روی موبایل، جدول به‌جای اسکرول افقی، به‌صورت کارت زیر هم نمایش داده می‌شه */
  @media (max-width:700px){
    .table-scroll{overflow-x:visible;}
    .table-scroll table{min-width:0;width:100%;border:none;background:none;}
    .table-scroll table thead{display:none;}
    .table-scroll table, .table-scroll table tbody, .table-scroll table tr, .table-scroll table td{display:block;width:100%;}
    .table-scroll table tr{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
    .table-scroll table td{border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;text-align:left;}
    .table-scroll table td:last-child{border-bottom:none;}
    .table-scroll table td::before{content:attr(data-label);color:var(--muted);font-size:11px;font-weight:600;flex-shrink:0;}
    .table-scroll table td.empty::before{content:none;}
    .table-scroll table td.actions-cell{display:block;}
    .table-scroll table td.actions-cell::before{content:none;}
  }
  h1{font-size:22px;font-weight:800;margin-bottom:6px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:28px;}

  .login-box{max-width:340px;margin:80px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;}
  .login-box input{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;color:var(--paper);font-family:inherit;font-size:14px;margin-bottom:12px;outline:none;
  }
  .login-box input:focus{border-color:var(--cyan);}
  .login-box button, .refresh-btn{
    width:100%;background:var(--cyan);color:#06120f;font-weight:700;padding:12px;border:none;
    border-radius:999px;font-family:inherit;font-size:14px;cursor:pointer;
  }
  .login-msg{color:#ff8080;font-size:13px;margin-top:10px;display:none;}
  .login-msg.show{display:block;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap;}
  .refresh-btn{width:auto;padding:10px 20px;}
  .stat{font-size:13px;color:var(--muted);}

  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  th,td{padding:12px 14px;text-align:right;font-size:13px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:600;background:var(--panel-2);}
  tr:last-child td{border-bottom:none;}
  .badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;}
  .badge.active{background:rgba(77,240,201,.12);color:var(--cyan);}
  .badge.blocked{background:rgba(255,128,128,.12);color:#ff8080;}
  .toggle-btn{
    background:none;border:1px solid var(--line);color:var(--paper);padding:6px 14px;border-radius:999px;
    font-family:inherit;font-size:12px;cursor:pointer;transition:border-color .2s ease;
  }
  .toggle-btn:hover{border-color:var(--violet);}
  .phone{font-family:'JetBrains Mono',monospace;direction:ltr;text-align:right;}
  .empty{text-align:center;color:var(--muted);padding:40px;}

  /* تب‌ها (کاربران / پروژه‌ها / منوساز) */
  .admin-tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .admin-tab{
    background:none;border:none;color:var(--muted);font-family:inherit;font-size:14px;font-weight:700;
    padding:10px 4px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .admin-tab.active{color:var(--cyan);border-bottom-color:var(--cyan);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .proj-name{font-family:'JetBrains Mono',monospace;font-weight:700;}
  .proj-owner{font-size:12px;color:var(--muted);}
  .proj-actions{display:flex;gap:6px;flex-wrap:wrap;}
  @media (max-width:700px){ .proj-actions{width:100%;} }
  .view-btn{
    background:none;border:1px solid var(--line);color:var(--violet);padding:6px 12px;border-radius:999px;
    font-family:inherit;font-size:12px;cursor:pointer;transition:border-color .2s ease;
  }
  .view-btn:hover{border-color:var(--violet);}
  .del-btn{
    background:none;border:1px solid rgba(255,128,128,.4);color:#ff8080;padding:6px 12px;border-radius:999px;
    font-family:inherit;font-size:12px;cursor:pointer;transition:border-color .2s ease;
  }
  .del-btn:hover{border-color:#ff8080;background:rgba(255,128,128,.08);}
  .link-btn{
    background:none;border:1px solid var(--line);color:var(--cyan);padding:6px 12px;border-radius:999px;
    font-family:inherit;font-size:12px;cursor:pointer;transition:border-color .2s ease;text-decoration:none;display:inline-block;
  }
  .link-btn:hover{border-color:var(--cyan);}

  .user-actions{display:flex;gap:6px;flex-wrap:wrap;}
  @media (max-width:700px){ .user-actions{width:100%;} }
  .imp-btn{
    background:none;border:1px solid var(--cyan);color:var(--cyan);padding:6px 12px;border-radius:999px;
    font-family:inherit;font-size:12px;cursor:pointer;transition:background-color .2s ease;white-space:nowrap;
  }
  .imp-btn:hover{background:rgba(77,240,201,.1);}
  .reset-btn{
    background:none;border:1px solid var(--line);color:var(--violet);padding:6px 12px;border-radius:999px;
    font-family:inherit;font-size:12px;cursor:pointer;transition:border-color .2s ease;white-space:nowrap;
  }
  .reset-btn:hover{border-color:var(--violet);}

  /* مودال مشاهده‌ی فایل‌های پروژه */
  .proj-modal-overlay{
    position:fixed;inset:0;background:rgba(7,11,18,.85);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;z-index:9999;padding:14px;
  }
  .proj-modal-overlay.show{display:flex;}
  .proj-modal{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    max-width:800px;width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;min-width:0;
  }
  .proj-modal-header{
    padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;
  }
  .proj-modal-header > div{min-width:0;overflow:hidden;}
  .proj-modal-header h3{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .proj-modal-header .sub{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .proj-modal-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;flex-shrink:0;}
  .proj-modal-tabs{
    display:flex;gap:6px;padding:10px 18px 0;border-bottom:1px solid var(--line);
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;
  }
  .proj-modal-tab{
    background:var(--panel-2);border:1px solid var(--line);border-bottom:none;color:var(--muted);
    font-family:'JetBrains Mono',monospace;font-size:12px;padding:8px 12px;border-radius:8px 8px 0 0;cursor:pointer;
    white-space:nowrap;flex-shrink:0;
  }
  .proj-modal-tab.active{color:var(--cyan);background:var(--panel);}
  .proj-modal-body{flex:1;overflow:auto;padding:16px 18px;min-width:0;}
  .proj-modal-body pre{
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--paper);white-space:pre-wrap;word-break:break-all;overflow-wrap:break-word;
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px;
    direction:ltr;text-align:left;unicode-bidi:embed;
  }
  .proj-modal-footer{
    padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;
  }
  #projModalPreview{
    width:100%;height:50vh;border:1px solid var(--line);border-radius:10px;background:#fff;display:none;
  }
  @media (max-width:480px){
    .proj-modal-footer{flex-direction:column-reverse;}
    .proj-modal-footer button{width:100%;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="login-box" id="loginBox">
    <h1 style="margin-bottom:16px;">ورود به پنل کاربران</h1>
    <input type="password" id="adminPass" placeholder="رمز عبور پنل">
    <button id="adminLoginBtn">ورود</button>
    <div class="login-msg" id="loginMsg"></div>
  </div>

  <div id="panelBox" style="display:none;">
    <h1>پنل مدیریت</h1>
    <p class="sub">کاربران ثبت‌نام‌شده، پروژه‌هایی که با ابزار «بارگذاری پروژه» ساختن، و کافه‌هایی که با «منوساز» فعال شدن — هرچی نامناسب بود از همین‌جا حذفش کن.</p>

    <div class="admin-tabs">
      <button class="admin-tab active" id="tabUsersBtn">👤 کاربران</button>
      <button class="admin-tab" id="tabProjectsBtn">📦 پروژه‌های بارگذاری‌شده</button>
    </div>

    <div class="tab-panel active" id="tabUsers">
      <div class="toolbar">
        <span class="stat" id="statText"></span>
        <button class="refresh-btn" id="refreshBtn" style="width:auto;">بروزرسانی</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>نام</th><th>شماره تماس</th><th>ایمیل</th><th>علاقه‌مندی‌ها</th><th>وضعیت</th><th></th><th></th></tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </div>

    <div class="tab-panel" id="tabProjects">
      <div class="toolbar">
        <span class="stat" id="projStatText"></span>
        <button class="refresh-btn" id="refreshProjBtn" style="width:auto;">بروزرسانی</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>نام پروژه</th><th>صاحب پروژه</th><th>حجم</th><th>آخرین ذخیره</th><th></th></tr>
          </thead>
          <tbody id="projectsBody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- مودال مشاهده‌ی محتوای پروژه -->
<div class="proj-modal-overlay" id="projModalOverlay">
  <div class="proj-modal">
    <div class="proj-modal-header">
      <div>
        <h3 id="projModalTitle">نام پروژه</h3>
        <div class="sub" id="projModalOwner"></div>
      </div>
      <button class="proj-modal-close" id="projModalClose">✕</button>
    </div>
    <div class="proj-modal-tabs">
      <button class="proj-modal-tab active" data-file="html">index.html</button>
      <button class="proj-modal-tab" data-file="css">style.css</button>
      <button class="proj-modal-tab" data-file="js">script.js</button>
      <button class="proj-modal-tab" data-file="preview">👁 پیش‌نمایش</button>
    </div>
    <div class="proj-modal-body">
      <pre id="projModalCode"></pre>
      <iframe id="projModalPreview" sandbox="allow-scripts"></iframe>
    </div>
    <div class="proj-modal-footer">
      <button class="toggle-btn" id="projModalClose2">بستن</button>
      <button class="del-btn" id="projModalDelete" style="padding:10px 18px;">🗑️ حذف این پروژه</button>
    </div>
  </div>
</div>

<script>
(function(){
  // آدرس Worker حساب‌کاربری رو بعد از دیپلوی، اینجا با آدرس واقعیت جایگزین کن
  const API_URL = "https://bytelab-users.bytelab.workers.dev";
  const TOKEN_KEY = "bytelab_users_admin_token";
  // MenuProAI بک‌اند جدایی داره (Worker خودش، KV خودش). تب نمایشی‌ش از
  // پنل حذف شده، ولی همچنان لازمه بفهمیم هر کاربر تو منوساز کافه داره
  // یا نه، تا دکمه‌ی «ورود به‌جای کاربر» بفهمه کجا ریدایرکت کنه.
  const MENUPROAI_API = "https://menuproai-api.bytelab.workers.dev";
  const ADMIN_PASS_KEY = "bytelab_admin_pass_session"; // برای احراز هویت به Worker منوساز

  // صفحه‌ی «ورود به‌جای کاربر»: یه نسخه از impersonate.html روی هر
  // دامنه (چون localStorage بین دامنه‌ها مشترک نیست). صفحه‌ی داشبورد
  // منوساز رو اگه اسمش چیز دیگه‌ایه، همینجا عوض کن.
  const IMPERSONATE_BYTELAB = "https://bytelabpro.xyz/impersonate.html";
  const IMPERSONATE_MENUPROAI = "https://menuproai.bytelabpro.xyz/impersonate.html";
  const MENUPROAI_DASHBOARD_PAGE = "dashboard.html"; // ← اگه اسم واقعی فرق داره، عوضش کن
  const BYTELAB_ACCOUNT_PAGE = "account.html"; // ← صفحه‌ی حساب‌کاربری طرف؛ اگه اسمش چیز دیگه‌ایه عوضش کن

  function getToken(){ try { return sessionStorage.getItem(TOKEN_KEY); } catch(e){ return null; } }
  function setToken(t){ try { sessionStorage.setItem(TOKEN_KEY, t); } catch(e){} }
  function getAdminPass(){ try { return sessionStorage.getItem(ADMIN_PASS_KEY); } catch(e){ return null; } }
  function setAdminPass(p){ try { sessionStorage.setItem(ADMIN_PASS_KEY, p); } catch(e){} }

  function escapeHTML(str){
    return String(str || "").replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  async function apiFetch(path, options){
    options = options || {};
    const headers = Object.assign({}, options.headers || {});
    const token = getToken();
    if (token) headers["Authorization"] = "Bearer " + token;
    if (options.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
    const res = await fetch(API_URL + path, Object.assign({}, options, { headers }));
    let data = null;
    try { data = await res.json(); } catch(e){}
    if (!res.ok) throw new Error((data && data.error) || "خطایی رخ داد.");
    return data;
  }

  // ============ تشخیص خاموش اینکه کاربر تو منوساز کافه داره یا نه ============
  // (بدون نمایش تب جدا؛ فقط برای تصمیم مقصد «ورود به‌جای کاربر»)
  let menuproaiOwnersCache = null; // Map<phone, {slug, active}>
  async function getMenuproaiOwnersMap(){
    if (menuproaiOwnersCache) return menuproaiOwnersCache;
    const adminPass = getAdminPass();
    if (!adminPass) return new Map();
    try {
      const res = await fetch(MENUPROAI_API + "/api/menu/admin/list", {
        method: "GET",
        headers: { "X-Admin-Password": adminPass },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) return new Map();
      const map = new Map();
      (data.cafes || []).forEach(c => { if (c.ownerPhone) map.set(c.ownerPhone, c); });
      menuproaiOwnersCache = map;
      return map;
    } catch(e) {
      return new Map();
    }
  }

  // ============ ورود به‌جای کاربر (Impersonate) ============
  async function doImpersonate(phone, btn){
    if (btn) btn.disabled = true;
    try {
      const data = await apiFetch("/api/admin/impersonate", { method: "POST", body: JSON.stringify({ phone }) });
      const owners = await getMenuproaiOwnersMap();
      const cafe = owners.get(phone);
      let url;
      if (cafe && cafe.active !== false) {
        url = `${IMPERSONATE_MENUPROAI}?token=${encodeURIComponent(data.token)}&redirect=${encodeURIComponent(MENUPROAI_DASHBOARD_PAGE)}`;
      } else {
        url = `${IMPERSONATE_BYTELAB}?token=${encodeURIComponent(data.token)}&redirect=${encodeURIComponent(BYTELAB_ACCOUNT_PAGE)}`;
      }
      window.open(url, "_blank");
    } catch(err) {
      alert(err.message || "ورود به‌جای کاربر ناموفق بود.");
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  // ============ ریست رمز عبور کاربر ============
  async function doResetPassword(phone){
    const custom = prompt("رمز جدید رو وارد کن (حداقل ۴ کاراکتر) — اگه خالی بذاری، رمز تصادفی ساخته می‌شه:");
    if (custom === null) return; // انصراف
    try {
      const data = await apiFetch("/api/admin/reset-password", {
        method: "POST",
        body: JSON.stringify({ phone, newPassword: custom || "" }),
      });
      prompt("رمز جدید کاربر (کپی کن و به کاربر بده):", data.newPassword);
    } catch(err) {
      alert(err.message || "ریست رمز ناموفق بود.");
    }
  }

  async function loadUsers(){
    const body = document.getElementById("usersBody");
    body.innerHTML = `<tr><td colspan="7" class="empty">در حال بارگذاری...</td></tr>`;
    try {
      const data = await apiFetch("/api/admin/users", { method: "GET" });
      const users = data.users || [];
      document.getElementById("statText").textContent = `${users.length} کاربر ثبت‌نام‌شده`;
      if (!users.length) {
        body.innerHTML = `<tr><td colspan="7" class="empty">هنوز کاربری ثبت‌نام نکرده.</td></tr>`;
        return;
      }
      body.innerHTML = users.map(u => `
        <tr>
          <td data-label="نام">${escapeHTML(u.name || "—")}</td>
          <td class="phone" data-label="شماره">${escapeHTML(u.phone)}</td>
          <td data-label="ایمیل">${escapeHTML(u.email || "—")}</td>
          <td data-label="علاقه‌مندی‌ها">${u.favoritesCount || 0}</td>
          <td data-label="وضعیت"><span class="badge ${u.active ? "active" : "blocked"}">${u.active ? "فعال" : "مسدود"}</span></td>
          <td data-label="دسترسی"><button class="toggle-btn" data-phone="${escapeHTML(u.phone)}">${u.active ? "مسدود کردن" : "فعال کردن"}</button></td>
          <td class="actions-cell">
            <div class="user-actions">
              <button class="imp-btn" data-phone="${escapeHTML(u.phone)}">🔑 ورود به‌جای کاربر</button>
              <button class="reset-btn" data-phone="${escapeHTML(u.phone)}">♻️ ریست رمز</button>
            </div>
          </td>
        </tr>`).join("");

      body.querySelectorAll(".toggle-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          try {
            await apiFetch("/api/admin/users/toggle-access", {
              method: "POST",
              body: JSON.stringify({ phone: btn.getAttribute("data-phone") }),
            });
            loadUsers();
          } catch(err) {
            btn.disabled = false;
          }
        });
      });
      body.querySelectorAll(".imp-btn").forEach(btn => {
        btn.addEventListener("click", () => doImpersonate(btn.getAttribute("data-phone"), btn));
      });
      body.querySelectorAll(".reset-btn").forEach(btn => {
        btn.addEventListener("click", () => doResetPassword(btn.getAttribute("data-phone")));
      });
    } catch(err) {
      body.innerHTML = `<tr><td colspan="7" class="empty">${escapeHTML(err.message)}</td></tr>`;
    }
  }

  document.getElementById("adminLoginBtn").addEventListener("click", async () => {
    const pass = document.getElementById("adminPass").value;
    const msgEl = document.getElementById("loginMsg");
    try {
      const data = await apiFetch("/api/admin/login", { method: "POST", body: JSON.stringify({ password: pass }) });
      setToken(data.token);
      setAdminPass(pass); // برای احراز هویت به Worker منوساز (تشخیص مقصد دکمه‌ی «ورود به‌جای کاربر»)
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("panelBox").style.display = "block";
      loadUsers();
    } catch(err) {
      msgEl.textContent = err.message || "ورود ناموفق بود.";
      msgEl.className = "login-msg show";
    }
  });

  document.getElementById("refreshBtn").addEventListener("click", loadUsers);

  // ============ تب‌ها ============
  const tabUsersBtn = document.getElementById("tabUsersBtn");
  const tabProjectsBtn = document.getElementById("tabProjectsBtn");
  const tabUsers = document.getElementById("tabUsers");
  const tabProjects = document.getElementById("tabProjects");

  function activateTab(btn, panel){
    [tabUsersBtn, tabProjectsBtn].forEach(b => b.classList.toggle("active", b === btn));
    [tabUsers, tabProjects].forEach(p => p.classList.toggle("active", p === panel));
  }

  tabUsersBtn.addEventListener("click", () => activateTab(tabUsersBtn, tabUsers));
  tabProjectsBtn.addEventListener("click", () => {
    activateTab(tabProjectsBtn, tabProjects);
    loadProjects();
  });

  // ============ پروژه‌های بارگذاری‌شده (نظارت ادمین) ============
  function formatFileSize(bytes){
    if (!bytes) return "0 B";
    const k = 1024, sizes = ["B","KB","MB"];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + " " + sizes[i];
  }

  async function loadProjects(){
    const body = document.getElementById("projectsBody");
    body.innerHTML = `<tr><td colspan="5" class="empty">در حال بارگذاری...</td></tr>`;
    try {
      const data = await apiFetch("/api/admin/projects", { method: "GET" });
      const projects = data.projects || [];
      document.getElementById("projStatText").textContent = `${projects.length} پروژه بارگذاری‌شده`;
      if (!projects.length) {
        body.innerHTML = `<tr><td colspan="5" class="empty">هنوز هیچ پروژه‌ای ذخیره نشده.</td></tr>`;
        return;
      }
      body.innerHTML = projects.map(p => {
        const dateStr = p.updatedAt ? new Date(p.updatedAt).toLocaleString("fa-IR") : "—";
        return `
        <tr>
          <td class="proj-name" data-label="نام پروژه">${escapeHTML(p.name)}</td>
          <td data-label="صاحب پروژه">
            ${escapeHTML(p.ownerName || "—")}<br>
            <span class="proj-owner phone">${escapeHTML(p.ownerPhone)}</span>
          </td>
          <td data-label="حجم">${formatFileSize(p.size)}</td>
          <td data-label="آخرین ذخیره">${dateStr}</td>
          <td class="actions-cell">
            <div class="proj-actions">
              <button class="view-btn" data-phone="${escapeHTML(p.ownerPhone)}" data-name="${escapeHTML(p.name)}">👁️ مشاهده</button>
              <button class="del-btn" data-phone="${escapeHTML(p.ownerPhone)}" data-name="${escapeHTML(p.name)}">🗑️ حذف</button>
            </div>
          </td>
        </tr>`;
      }).join("");

      body.querySelectorAll(".view-btn").forEach(btn => {
        btn.addEventListener("click", () => openProjectModal(btn.getAttribute("data-phone"), btn.getAttribute("data-name")));
      });
      body.querySelectorAll(".del-btn").forEach(btn => {
        btn.addEventListener("click", () => deleteProject(btn.getAttribute("data-phone"), btn.getAttribute("data-name"), loadProjects));
      });
    } catch(err) {
      body.innerHTML = `<tr><td colspan="5" class="empty">${escapeHTML(err.message)}</td></tr>`;
    }
  }

  document.getElementById("refreshProjBtn").addEventListener("click", loadProjects);

  // ============ مودال مشاهده‌ی محتوای پروژه ============
  const projModalOverlay = document.getElementById("projModalOverlay");
  const projModalTitle = document.getElementById("projModalTitle");
  const projModalOwner = document.getElementById("projModalOwner");
  const projModalCode = document.getElementById("projModalCode");
  const projModalPreview = document.getElementById("projModalPreview");
  const projModalDelete = document.getElementById("projModalDelete");
  let currentModalProject = null; // { phone, name, files }
  let currentModalTab = "html";

  function buildPreviewDoc(files){
    const htmlFile = files.html && files.html.content ? files.html.content : "<!DOCTYPE html><html><head></head><body></body></html>";
    const css = files.css && files.css.content ? files.css.content : "";
    const js = files.js && files.js.content ? files.js.content : "";
    let doc = htmlFile;
    const styleTag = css ? `<style>${css}</style>` : "";
    const scriptTag = js ? `<script>${js}<\/script>` : "";
    doc = doc.includes("</head>") ? doc.replace("</head>", styleTag + "</head>") : styleTag + doc;
    doc = doc.includes("</body>") ? doc.replace("</body>", scriptTag + "</body>") : doc + scriptTag;
    return doc;
  }

  async function openProjectModal(phone, name){
    projModalOverlay.classList.add("show");
    projModalTitle.textContent = name;
    projModalOwner.textContent = "در حال بارگذاری...";
    projModalCode.textContent = "";
    try {
      const data = await apiFetch(`/api/admin/projects/get?phone=${encodeURIComponent(phone)}&name=${encodeURIComponent(name)}`, { method: "GET" });
      currentModalProject = { phone, name, files: data.project.files };
      projModalOwner.textContent = `صاحب پروژه: ${phone}`;
      currentModalTab = "html";
      document.querySelectorAll(".proj-modal-tab").forEach(t => t.classList.toggle("active", t.getAttribute("data-file") === "html"));
      renderModalTab();
    } catch(err) {
      projModalOwner.textContent = err.message || "خطا در بارگذاری پروژه";
    }
  }

  function renderModalTab(){
    if (!currentModalProject) return;
    if (currentModalTab === "preview") {
      projModalCode.style.display = "none";
      projModalPreview.style.display = "block";
      projModalPreview.srcdoc = buildPreviewDoc(currentModalProject.files);
      return;
    }
    projModalPreview.style.display = "none";
    projModalCode.style.display = "block";
    const f = currentModalProject.files[currentModalTab];
    projModalCode.textContent = f ? f.content : "(خالی)";
  }

  document.querySelectorAll(".proj-modal-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".proj-modal-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentModalTab = tab.getAttribute("data-file");
      renderModalTab();
    });
  });

  function closeProjectModal(){
    projModalOverlay.classList.remove("show");
    currentModalProject = null;
    projModalPreview.srcdoc = "";
  }
  document.getElementById("projModalClose").addEventListener("click", closeProjectModal);
  document.getElementById("projModalClose2").addEventListener("click", closeProjectModal);
  projModalOverlay.addEventListener("click", (e) => { if (e.target === projModalOverlay) closeProjectModal(); });

  projModalDelete.addEventListener("click", () => {
    if (!currentModalProject) return;
    deleteProject(currentModalProject.phone, currentModalProject.name, () => { closeProjectModal(); loadProjects(); });
  });

  async function deleteProject(phone, name, onDone){
    if (!confirm(`مطمئنی می‌خوای پروژه‌ی «${name}» رو برای همیشه حذف کنی؟ این کار قابل بازگشت نیست.`)) return;
    try {
      await apiFetch("/api/admin/projects/delete", { method: "POST", body: JSON.stringify({ phone, name }) });
      if (onDone) onDone();
    } catch(err) {
      alert(err.message || "حذف با خطا مواجه شد.");
    }
  }

  if (getToken()) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("panelBox").style.display = "block";
    loadUsers();
  }
})();
</script>
</body>
</html>
