<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>آنالیزور سایت | بایت‌لب</title>
<meta name="description" content="سایتت رو رایگان تحلیل کن؛ سرعت، سئوی پایه، ریسپانسیو بودن و SSL رو در چند ثانیه بررسی کن.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="بایت‌لب">
<meta property="og:title" content="آنالیزور سایت | بایت‌لب">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#070b12;
    --panel:#0f1620;
    --panel-2:#141d2b;
    --line:#1e2a38;
    --cyan:#4df0c9;
    --violet:#9c7bff;
    --paper:#eaf0f4;
    --muted:#7c8b9c;
    --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;overflow-x:hidden;}
  body{
    background:var(--ink);color:var(--paper);font-family:'Vazirmatn',sans-serif;
    line-height:1.7;overflow-x:hidden;width:100%;
    padding:0;margin:0;
  }
  main{
    margin-top:88px;
    padding:40px 16px 60px;
    max-width:680px;
    margin-left:auto;
    margin-right:auto;
  }
  .page-header{margin-bottom:32px;}
  .sec-eyebrow{
    font-family:'Vazirmatn',sans-serif;font-weight:700;font-size:12px;
    color:var(--violet);letter-spacing:.02em;margin-bottom:8px;display:block;text-transform:uppercase;
  }
  h1{font-size:28px;font-weight:800;margin:0 0 12px;color:var(--paper);}
  .sec-sub{color:var(--muted);font-size:14px;line-height:1.6;}

  .card{
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:24px;
    margin-bottom:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .input-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  input[type=text]{
    flex:1;min-width:150px;
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;color:var(--paper);
    font-family:inherit;font-size:14px;direction:ltr;text-align:left;
  }
  input[type=text]:focus{outline:2px solid var(--cyan);border-color:var(--cyan);}
  button{
    background:var(--cyan);border:none;border-radius:10px;padding:12px 20px;
    color:var(--ink);font-weight:700;font-family:inherit;font-size:14px;
    cursor:pointer;white-space:nowrap;transition:transform .2s ease;
  }
  button:hover{transform:translateY(-1px);}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .hint{color:var(--muted);font-size:12px;margin-top:8px;}

  #result{margin-top:16px;display:none;}
  .score-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 0;}
  .score-circle{
    width:120px;height:120px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
    background:conic-gradient(var(--ring-color,var(--cyan)) calc(var(--pct,0) * 1%), #1b263c 0);
    position:relative;
  }
  .score-circle::before{
    content:"";position:absolute;inset:8px;
    background:var(--panel);border-radius:50%;
  }
  .score-circle .num{position:relative;font-size:32px;font-weight:800;}
  .score-circle .lbl{position:relative;font-size:11px;color:var(--muted);}
  .score-verdict{margin-top:12px;font-size:13px;color:var(--muted);text-align:center;max-width:300px;}

  .checks{margin-top:16px;display:flex;flex-direction:column;gap:8px;}
  .check{
    display:flex;align-items:flex-start;gap:10px;
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;
  }
  .check .dot{
    width:20px;height:20px;border-radius:50%;
    flex:none;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;margin-top:2px;
  }
  .dot.ok{background:rgba(34,197,94,.15);color:#22c55e;}
  .dot.warn{background:rgba(234,179,8,.15);color:#eab308;}
  .dot.bad{background:rgba(239,68,68,.15);color:#ef4444;}
  .check .body{flex:1;}
  .check .body b{display:block;font-size:13px;margin-bottom:2px;font-weight:600;}
  .check .body span{font-size:12px;color:var(--muted);line-height:1.5;}

  .cta{
    margin-top:20px;
    background:linear-gradient(135deg,#1a2540,#141d2e);
    border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;
  }
  .cta p{margin:0 0 10px;font-size:13px;line-height:1.6;color:var(--paper);}
  .cta a{
    display:inline-block;
    background:var(--cyan);color:var(--ink);font-weight:700;text-decoration:none;
    padding:10px 18px;border-radius:10px;font-size:13px;transition:transform .2s ease;
  }
  .cta a:hover{transform:translateY(-1px);}

  .loading{display:none;text-align:center;padding:24px 0;color:var(--muted);}
  .spinner{
    width:32px;height:32px;border-radius:50%;
    border:3px solid var(--line);border-top-color:var(--cyan);
    margin:0 auto 10px;animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .error{
    display:none;
    background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4);
    color:#fca5a5;padding:12px 14px;border-radius:10px;
    margin-top:12px;font-size:13px;
  }
  @media (max-width:640px){
    main{padding:30px 12px 50px;margin-top:72px;}
    h1{font-size:24px;}
    .card{padding:16px;}
    .score-circle{width:100px;height:100px;}
    .score-circle .num{font-size:28px;}
    input[type=text]{font-size:13px;padding:10px 12px;}
    button{padding:10px 16px;font-size:13px;}
  }
</style>
</head>
<body>
<main>
  <header class="page-header">
    <span class="sec-eyebrow">🔍 ابزار</span>
    <h1>آنالیزور سایت</h1>
    <p class="sec-sub">آدرس سایتت رو بده، سرعت، سئو، ریسپانسیو و SSL رو چک کن.</p>
  </header>

  <div class="card">
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="example.com" inputmode="url">
      <button id="analyzeBtn">تحلیل</button>
    </div>
    <div class="hint">فقط آدرس بنویس (https:// اختیاری)</div>
    <div class="error" id="errorBox"></div>
    <div class="loading" id="loadingBox">
      <div class="spinner"></div>
      بررسی می‌شه...
    </div>
  </div>

  <div id="result">
    <div class="card">
      <div class="score-wrap">
        <div class="score-circle" id="scoreCircle">
          <div class="num" id="scoreNum">0</div>
          <div class="lbl">از ۱۰۰</div>
        </div>
        <div class="score-verdict" id="scoreVerdict"></div>
      </div>
      <div class="checks" id="checksList"></div>
    </div>

    <div class="cta">
      <p>تیم بایت‌لب می‌تونه سایتت رو بهبود بده!</p>
      <a href="https://t.me/bytelab" target="_blank">مشاوره رایگان</a>
    </div>
  </div>
</main>

<script src="header.js"></script>
<script>
const API_ENDPOINT = 'https://bytelab-users.bytelab.workers.dev/api/audit';
const urlInput = document.getElementById('urlInput');
const analyzeBtn = document.getElementById('analyzeBtn');
const errorBox = document.getElementById('errorBox');
const loadingBox = document.getElementById('loadingBox');
const resultBox = document.getElementById('result');

function normalizeUrl(v){
  v = v.trim();
  if(!v) return null;
  if(!/^https?:\/\//i.test(v)) v = 'https://' + v;
  try{
    const u = new URL(v);
    return u.href;
  }catch(e){ return null; }
}

function setLoading(on){
  analyzeBtn.disabled = on;
  loadingBox.style.display = on ? 'block' : 'none';
  if(on){ errorBox.style.display='none'; resultBox.style.display='none'; }
}

function scoreColor(pct){
  if(pct >= 80) return '#22c55e';
  if(pct >= 50) return '#eab308';
  return '#ef4444';
}

function verdictText(pct){
  if(pct >= 80) return 'عالیه! سایتت وضعیت خوبی داره، فقط چند نکته جزئی مونده.';
  if(pct >= 50) return 'وضعیت متوسطه — چند مشکل مهم هست که روی جذب مشتری و رتبه گوگل اثر می‌ذاره.';
  return 'سایتت چند ضعف جدی داره که احتمالاً داره مشتری و رتبه گوگل رو از دستت در می‌بره.';
}

function renderCheck(status, title, desc){
  const iconMap = {ok:'✓', warn:'!', bad:'✕'};
  return `<div class="check">
    <div class="dot ${status}">${iconMap[status]}</div>
    <div class="body"><b>${title}</b><span>${desc}</span></div>
  </div>`;
}

function render(data){
  document.getElementById('scoreNum').textContent = data.score;
  document.getElementById('scoreCircle').style.setProperty('--pct', data.score);
  document.getElementById('scoreCircle').style.setProperty('--ring-color', scoreColor(data.score));
  document.getElementById('scoreVerdict').textContent = verdictText(data.score);

  const list = document.getElementById('checksList');
  list.innerHTML = data.checks.map(c => renderCheck(c.status, c.title, c.desc)).join('');
  resultBox.style.display = 'block';
}

async function analyze(){
  const normalized = normalizeUrl(urlInput.value);
  if(!normalized){
    errorBox.textContent = 'لطفاً یک آدرس معتبر وارد کن (مثل example.com)';
    errorBox.style.display = 'block';
    return;
  }

  setLoading(true);
  try{
    const res = await fetch(API_ENDPOINT + '?url=' + encodeURIComponent(normalized));
    let data;
    try{
      data = await res.json();
    }catch(parseErr){
      throw new Error('پاسخ سرور معتبر نبود (status ' + res.status + ')');
    }
    if(!res.ok || data.error) throw new Error(data.error || ('خطای سرور (status ' + res.status + ')'));
    render(data);
  }catch(e){
    errorBox.textContent = (e && e.message) ? e.message : 'نتونستیم سایت رو بررسی کنیم. مطمئن شو آدرس درسته و سایت در دسترسه.';
    errorBox.style.display = 'block';
  }finally{
    setLoading(false);
  }
}

analyzeBtn.addEventListener('click', analyze);
urlInput.addEventListener('keydown', e => { if(e.key === 'Enter') analyze(); });
</script>
</body>
</html>
